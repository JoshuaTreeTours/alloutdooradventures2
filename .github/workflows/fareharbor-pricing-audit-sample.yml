name: FareHarbor pricing sample audit

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run 75-product current price-preview endpoint audit
        run: npx tsx scripts/audit-fareharbor-price-preview.ts

      - name: Upload price-preview audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fareharbor-price-preview-audit
          path: |
            artifacts/fareharbor-price-preview-audit.json
            artifacts/fareharbor-price-preview-audit-summary.json
          if-no-files-found: error
