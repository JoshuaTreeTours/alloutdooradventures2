name: Apply Engine6 LCP patch

on:
  push:
    paths:
      - .github/workflows/apply-engine6-lcp-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Render route-backed Engine6 fixture immediately
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/engine6/Engine6SpecimenRoute.tsx')
          text = path.read_text()
          old = '''  const [state, setState] = useState<Engine6SpecimenViewState>(() => ({\n    tour: null,\n    error: null,\n    debug: buildInitialEngine6SpecimenDebug(\n      requestedProductCode ?? "",\n      apiUrl ?? ""\n    ),\n    isLoading: true,\n  }));'''
          new = '''  const [state, setState] = useState<Engine6SpecimenViewState>(() => ({\n    tour: routeBackedFallbackTour,\n    error: null,\n    debug: buildInitialEngine6SpecimenDebug(\n      requestedProductCode ?? "",\n      apiUrl ?? ""\n    ),\n    isLoading: !routeBackedFallbackTour,\n  }));'''
          if new in text:
              print('Patch already applied.')
          elif old in text:
              path.write_text(text.replace(old, new, 1))
              print('Patch applied.')
          else:
              raise SystemExit('Expected Engine6 state initializer not found; refusing unsafe edit.')
          PY
      - name: Verify TypeScript
        run: npm ci --ignore-scripts && npx tsc --noEmit
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- src/pages/engine6/Engine6SpecimenRoute.tsx; then
            echo "No code change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/engine6/Engine6SpecimenRoute.tsx
          git commit -m "perf: render Engine6 fixture before live enrichment"
          git push origin HEAD:${{ github.ref_name }}
