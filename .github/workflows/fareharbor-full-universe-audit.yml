name: FareHarbor full-universe pricing audit

on:
  pull_request:
    branches:
      - feat/fareharbor-commercial-reserve-phase3

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: npm ci

      - name: Test FareHarbor pricing resolvers
        run: npx vitest run src/utils/fareharbor/pricePreview.test.ts

      - name: Audit entire FareHarbor universe
        run: npx tsx scripts/audit-fareharbor-full-universe.ts

      - name: Upload full-universe pricing audit
        uses: actions/upload-artifact@v4
        with:
          name: fareharbor-full-universe-pricing-audit
          path: |
            reports/fareharbor-full-universe-pricing-audit.json
            reports/fareharbor-full-universe-pricing-audit.md
          if-no-files-found: error
