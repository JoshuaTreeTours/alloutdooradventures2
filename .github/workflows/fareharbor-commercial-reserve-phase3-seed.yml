name: FareHarbor Commercial Reserve Phase 3 seed

on:
  pull_request:
    branches:
      - feat/fareharbor-commercial-reserve-phase2

permissions:
  contents: read

jobs:
  seed-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: npm ci

      - name: Test Phase 1, Phase 2, and Phase 3 price resolvers
        run: npx vitest run src/utils/fareharbor/pricePreview.test.ts

      - name: Baseline typecheck (non-blocking while inherited repository issues remain)
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Seed Phase 3 consensus shadow cohort
        run: npx tsx scripts/fetch-fareharbor-pricing-phase3.ts

      - name: Audit unresolved Phase 3 traveler labels
        run: npx tsx scripts/audit-fareharbor-pricing-phase3.ts

      - name: Upload Phase 3 shadow reserve
        uses: actions/upload-artifact@v4
        with:
          name: fareharbor-commercial-reserve-phase3
          path: src/data/fareharborPricingPhase3.ts
          if-no-files-found: error

      - name: Upload Phase 3 unresolved-label audit
        uses: actions/upload-artifact@v4
        with:
          name: fareharbor-commercial-reserve-phase3-audit
          path: reports/fareharbor-phase3-label-audit.json
          if-no-files-found: error
