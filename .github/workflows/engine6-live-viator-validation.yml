name: Engine6 Live Viator Validation

on:
  pull_request:
    paths:
      - ".github/workflows/engine6-live-viator-validation.yml"
      - "data/engine6/**"
      - "data/merchantFeed.csv"
      - "scripts/generate-*-engine6-fixtures.ts"
      - "scripts/validate-engine6-production-viator.ts"
      - "scripts/vercel-build.mjs"
      - "src/engine6/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/engine6-live-viator-validation.yml"
      - "data/engine6/**"
      - "data/merchantFeed.csv"
      - "scripts/generate-*-engine6-fixtures.ts"
      - "scripts/validate-engine6-production-viator.ts"
      - "scripts/vercel-build.mjs"
      - "src/engine6/**"
  workflow_dispatch:
    inputs:
      validation_mode:
        description: Validation mode
        required: false
        default: pr-scoped
        type: choice
        options:
          - pr-scoped
          - strict
      base_ref:
        description: Base git ref for scoped product detection (pr-scoped only)
        required: false
        default: origin/main

concurrency:
  group: engine6-live-viator-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-engine6-viator-products:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Resolve validation base ref
        id: validation-base
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ]; then
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ inputs.base_ref || 'origin/main' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate configured Engine6 Viator products
        env:
          VIATOR_API_KEY: ${{ secrets.VIATOR_API_KEY }}
          ENGINE6_LIVE_VIATOR_VALIDATION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_mode || 'pr-scoped' }}
          ENGINE6_LIVE_VIATOR_VALIDATION_BASE_REF: ${{ steps.validation-base.outputs.ref }}
        run: npm run validate:engine6-live-viator

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine6-live-viator-validation-report
          path: artifacts/engine6-live-viator-production-validation.json
          if-no-files-found: ignore
