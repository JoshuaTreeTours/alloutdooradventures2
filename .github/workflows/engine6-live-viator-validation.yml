name: Engine6 Live Viator Validation

on:
  pull_request:
    paths:
      - ".github/workflows/engine6-live-viator-validation.yml"
      - "data/engine6/**"
      - "data/merchantFeed.csv"
      - "scripts/generate-*-engine6-fixtures.ts"
      - "scripts/*product-selection.json"
      - "scripts/validate-engine6-production-viator.ts"
      - "scripts/validate-engine6-product-selection-governance.ts"
      - "scripts/audit-engine6-stage2-governance.ts"
      - "scripts/vercel-build.mjs"
      - "src/engine6/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/engine6-live-viator-validation.yml"
      - "data/engine6/**"
      - "data/merchantFeed.csv"
      - "scripts/generate-*-engine6-fixtures.ts"
      - "scripts/*product-selection.json"
      - "scripts/validate-engine6-production-viator.ts"
      - "scripts/validate-engine6-product-selection-governance.ts"
      - "scripts/audit-engine6-stage2-governance.ts"
      - "scripts/vercel-build.mjs"
      - "src/engine6/**"
  workflow_dispatch:
    inputs:
      governance_mode:
        description: Governance mode
        required: false
        default: strict
        type: choice
        options:
          - audit
          - warn
          - strict
      full_site_audit:
        description: Validate the full Engine6 catalog (strict scheduled audit)
        required: false
        default: false
        type: boolean
      base_ref:
        description: Base git ref for scoped product detection
        required: false
        default: origin/main

concurrency:
  group: engine6-live-viator-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-engine6-viator-products:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Resolve validation base ref
        id: validation-base
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ]; then
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ inputs.base_ref || 'origin/main' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve governance mode
        id: governance
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.governance_mode || 'strict' }}" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.full_site_audit }}" = "true" ]; then
              echo "full_audit=1" >> "$GITHUB_OUTPUT"
            else
              echo "full_audit=0" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "mode=warn" >> "$GITHUB_OUTPUT"
            echo "full_audit=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate configured Engine6 Viator products
        env:
          VIATOR_API_KEY: ${{ secrets.VIATOR_API_KEY }}
          ENGINE6_GOVERNANCE_MODE: ${{ steps.governance.outputs.mode }}
          ENGINE6_LIVE_VIATOR_VALIDATION_MODE: ${{ steps.governance.outputs.mode == 'strict' && 'strict' || 'pr-scoped' }}
          ENGINE6_LIVE_VIATOR_VALIDATION_BASE_REF: ${{ steps.validation-base.outputs.ref }}
          ENGINE6_GOVERNANCE_BASE_REF: ${{ steps.validation-base.outputs.ref }}
          ENGINE6_GOVERNANCE_FULL_AUDIT: ${{ steps.governance.outputs.full_audit }}
        run: npm run validate:engine6-live-viator

      - name: Validate Engine6 product selection governance
        if: hashFiles('scripts/glacier-product-selection.json') != ''
        env:
          VIATOR_API_KEY: ${{ secrets.VIATOR_API_KEY }}
          ENGINE6_GOVERNANCE_MODE: ${{ steps.governance.outputs.mode }}
          ENGINE6_PRODUCT_SELECTION_SLOTS_PATH: scripts/glacier-product-selection.json
          ENGINE6_PRODUCT_SELECTION_DESTINATION: Glacier National Park / West Glacier
        run: npm run validate:engine6-product-selection:strict

      - name: Run Engine6 stage 2 governance audit
        env:
          VIATOR_API_KEY: ${{ secrets.VIATOR_API_KEY }}
          ENGINE6_GOVERNANCE_MODE: ${{ steps.governance.outputs.mode }}
          ENGINE6_STAGE2_GOVERNANCE_HEAD_REF: HEAD
          ENGINE6_GOVERNANCE_BASE_REF: ${{ steps.validation-base.outputs.ref }}
          ENGINE6_GOVERNANCE_FULL_AUDIT: ${{ steps.governance.outputs.full_audit }}
        run: npm run audit:engine6-stage2-governance

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine6-live-viator-validation-report
          path: |
            artifacts/engine6-live-viator-production-validation.json
            reports/engine6-stage2-governance-audit.json
            reports/engine6-stage2-governance-audit.md
          if-no-files-found: ignore
