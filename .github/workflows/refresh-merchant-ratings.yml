name: Refresh Merchant Feed Ratings

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * 1"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-merchant-ratings.yml"
      - "scripts/refresh-merchant-rating-metadata.ts"

permissions:
  contents: write

concurrency:
  group: refresh-merchant-feed-ratings
  cancel-in-progress: false

jobs:
  refresh-ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Refresh merchant rating metadata from Viator reviews API
        env:
          VIATOR_API_KEY: ${{ secrets.VIATOR_API_KEY }}
          VIATOR_API_BASE_URL: https://api.viator.com/partner
          MERCHANT_RATING_CONCURRENCY: "20"
          MERCHANT_RATING_REQUEST_TIMEOUT_MS: "20000"
        run: npx tsx scripts/refresh-merchant-rating-metadata.ts

      - name: Commit refreshed merchant feed
        shell: bash
        run: |
          if git diff --quiet -- data/merchantFeed.csv; then
            echo "No rating changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/merchantFeed.csv
          git commit -m "Refresh merchant feed aggregate ratings"
          git push
