name: Refresh Merchant Feed Ratings

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * 1"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-merchant-ratings.yml"
      - "scripts/refresh-merchant-rating-metadata.ts"

permissions:
  contents: write

concurrency:
  group: refresh-merchant-feed-ratings
  cancel-in-progress: true

jobs:
  refresh-ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Refresh merchant rating metadata using proven Magpie method
        env:
          MERCHANT_RATING_BASE_URL: https://www.alloutdooradventures.com
          MERCHANT_RATING_DELAY_MS: "150"
          MERCHANT_RATING_REQUEST_TIMEOUT_MS: "15000"
          MERCHANT_RATING_MAX_ATTEMPTS: "3"
        run: npx tsx scripts/refresh-merchant-rating-metadata.ts

      - name: Upload refresh report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merchant-rating-refresh-report
          path: merchant-rating-refresh-report.json
          if-no-files-found: warn

      - name: Commit refreshed merchant feed
        shell: bash
        run: |
          if git diff --quiet -- data/merchantFeed.csv; then
            echo "No rating changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/merchantFeed.csv
          git commit -m "Refresh merchant feed aggregate ratings"
          git push
