name: FareHarbor description universe audit

on:
  pull_request:
    branches:
      - feat/fareharbor-commercial-reserve-phase3

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: npm ci

      - name: Audit FareHarbor description universe
        run: npx tsx scripts/audit-fareharbor-description-universe.ts

      - name: Upload description universe audit
        uses: actions/upload-artifact@v4
        with:
          name: fareharbor-description-universe-audit
          path: |
            reports/fareharbor-description-universe-audit.json
            reports/fareharbor-description-universe-audit.md
          if-no-files-found: error
