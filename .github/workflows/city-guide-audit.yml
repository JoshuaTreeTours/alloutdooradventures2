name: City Guide Audit

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  city-guide-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run city guide audit (strict)
        run: npm run audit:city-guides:strict

      - name: Rank city guide repair priorities
        if: always()
        run: npx tsx scripts/rank-city-guide-quality.ts

      - name: Rank Phase III Engine6 guide priorities
        if: always()
        run: npx tsx scripts/rank-phase3-engine6-guide-priority.ts

      - name: Upload Phase III Engine6 priority report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-engine6-guide-priority
          path: |
            reports/phase3-engine6-guide-priority.md
            reports/phase3-engine6-guide-priority.json
