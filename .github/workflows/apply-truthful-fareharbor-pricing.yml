name: Apply truthful FareHarbor pricing repair

on:
  push:
    branches:
      - fix/fareharbor-truthful-price-no-129-fallback

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/fareharbor-truthful-price-no-129-fallback
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: npm ci

      - name: Apply truthful-price repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {found}: {old[:120]!r}")
              p.write_text(text.replace(old, new))

          # One shared definition of a commercially reliable price. The historical
          # $129 floor remains available to unrelated legacy callers, but the
          # tour/render/schema paths repaired here no longer use it as invented data.
          replace(
              "src/utils/merchantPricing.ts",
              '''export const applyPriceFloor = (price: number | null): number => {\n  if (price === null || !Number.isFinite(price) || price <= 0) {\n    return PRICE_FLOOR_USD;\n  }\n\n  if (price < PRICE_MIN_THRESHOLD_USD) {\n    return PRICE_FLOOR_USD;\n  }\n\n  return price;\n};''',
              '''export const resolveReliableMerchantPrice = (value: unknown): number | null => {\n  const price = parsePrice(value);\n  if (price === null || !Number.isFinite(price) || price < PRICE_MIN_THRESHOLD_USD) {\n    return null;\n  }\n\n  return price;\n};\n\nexport const applyPriceFloor = (price: number | null): number => {\n  if (price === null || !Number.isFinite(price) || price <= 0) {\n    return PRICE_FLOOR_USD;\n  }\n\n  if (price < PRICE_MIN_THRESHOLD_USD) {\n    return PRICE_FLOOR_USD;\n  }\n\n  return price;\n};'''
          )

          # Legacy Product/TouristTrip helper: no price means no Offer, rather than
          # fabricating $129. Real catalog/reserve prices still emit the same Offer.
          replace(
              "src/utils/structuredData.ts",
              'import { applyPriceFloor } from "./merchantPricing";',
              'import { resolveReliableMerchantPrice } from "./merchantPricing";'
          )
          replace(
              "src/utils/structuredData.ts",
              '''const toOfferPrice = (tour: Tour) =>\n  applyPriceFloor(tour.startingPrice ?? null);''',
              '''const toOfferPrice = (tour: Tour) =>\n  resolveReliableMerchantPrice(tour.startingPrice);'''
          )
          replace(
              "src/utils/structuredData.ts",
              '''  const offer = {\n    "@type": "Offer",\n    url: offerUrl,\n    availability: "https://schema.org/InStock",\n    price: toOfferPrice(tour).toFixed(2),\n    priceCurrency: toOfferCurrency(tour),\n    priceValidUntil: getPriceValidUntil(),\n  };''',
              '''  const offerPrice = toOfferPrice(tour);\n  const offer =\n    offerPrice === null\n      ? null\n      : {\n          "@type": "Offer",\n          url: offerUrl,\n          availability: "https://schema.org/InStock",\n          price: offerPrice.toFixed(2),\n          priceCurrency: toOfferCurrency(tour),\n          priceValidUntil: getPriceValidUntil(),\n        };'''
          )
          replace(
              "src/utils/structuredData.ts",
              '''    offers: offer,\n    ...(aggregateRating ? { aggregateRating } : {}),\n    priceSpecification: {\n      "@type": "PriceSpecification",\n      description: TOUR_PRICE_DESCRIPTION,\n    },''',
              '''    ...(offer ? { offers: offer } : {}),\n    ...(aggregateRating ? { aggregateRating } : {}),\n    ...(offer\n      ? {\n          priceSpecification: {\n            "@type": "PriceSpecification",\n            description: TOUR_PRICE_DESCRIPTION,\n          },\n        }\n      : {}),'''
          )
          replace(
              "src/utils/structuredData.ts",
              '''    offers: {\n      "@type": "Offer",\n      url: offerUrl,\n      availability: "https://schema.org/InStock",\n      price: toOfferPrice(tour).toFixed(2),\n      priceCurrency: toOfferCurrency(tour),\n      priceValidUntil: getPriceValidUntil(),\n    },\n    ...(!safeSchemaEnabled && aggregateRating ? { aggregateRating } : {}),\n    priceSpecification: {\n      "@type": "PriceSpecification",\n      description: TOUR_PRICE_DESCRIPTION,\n    },''',
              '''    ...(toOfferPrice(tour) !== null\n      ? {\n          offers: {\n            "@type": "Offer",\n            url: offerUrl,\n            availability: "https://schema.org/InStock",\n            price: toOfferPrice(tour)!.toFixed(2),\n            priceCurrency: toOfferCurrency(tour),\n            priceValidUntil: getPriceValidUntil(),\n          },\n        }\n      : {}),\n    ...(!safeSchemaEnabled && aggregateRating ? { aggregateRating } : {}),\n    ...(toOfferPrice(tour) !== null\n      ? {\n          priceSpecification: {\n            "@type": "PriceSpecification",\n            description: TOUR_PRICE_DESCRIPTION,\n          },\n        }\n      : {}),'''
          )

          # Shared V1 graph: a null/invalid price now omits Offer entirely.
          replace(
              "src/schema/buildTourSchemaGraph.ts",
              '''  const offerNode: Record<string, unknown> =\n    Number.isFinite(lowPrice) && Number.isFinite(highPrice)\n      ? {\n          "@type": "AggregateOffer",\n          url: args.offers.url,\n          availability: offerAvailability,\n          lowPrice: Number(lowPrice).toFixed(2),\n          highPrice: Number(highPrice).toFixed(2),\n          priceCurrency: args.offers.priceCurrency,\n          ...(typeof args.offers.offerCount === "number"\n            ? { offerCount: args.offers.offerCount }\n            : {}),\n        }\n      : {\n          "@type": "Offer",\n          url: args.offers.url,\n          availability: offerAvailability,\n          ...(args.offers.price !== null && args.offers.price !== undefined\n            ? { price: Number(args.offers.price).toFixed(2) }\n            : {}),\n          priceCurrency: args.offers.priceCurrency,\n          priceValidUntil: getPriceValidUntil(),\n        };''',
              '''  const singlePrice =\n    args.offers.price === null || args.offers.price === undefined\n      ? null\n      : Number(args.offers.price);\n  const offerNode: Record<string, unknown> | null =\n    Number.isFinite(lowPrice) && Number.isFinite(highPrice)\n      ? {\n          "@type": "AggregateOffer",\n          url: args.offers.url,\n          availability: offerAvailability,\n          lowPrice: Number(lowPrice).toFixed(2),\n          highPrice: Number(highPrice).toFixed(2),\n          priceCurrency: args.offers.priceCurrency,\n          ...(typeof args.offers.offerCount === "number"\n            ? { offerCount: args.offers.offerCount }\n            : {}),\n        }\n      : Number.isFinite(singlePrice) && Number(singlePrice) > 0\n        ? {\n            "@type": "Offer",\n            url: args.offers.url,\n            availability: offerAvailability,\n            price: Number(singlePrice).toFixed(2),\n            priceCurrency: args.offers.priceCurrency,\n            priceValidUntil: getPriceValidUntil(),\n          }\n        : null;'''
          )
          replace(
              "src/schema/buildTourSchemaGraph.ts",
              '''        offers: offerNode,\n        mainEntityOfPage:''',
              '''        ...(offerNode ? { offers: offerNode } : {}),\n        mainEntityOfPage:'''
          )
          replace(
              "src/schema/buildTourSchemaGraph.ts",
              '''        offers: offerNode,\n      },\n    ],''',
              '''        ...(offerNode ? { offers: offerNode } : {}),\n      },\n    ],'''
          )

          # Engine2 schema: use only a real/validated price. The high-confidence
          # FareHarbor reserve is already injected upstream by loadEngine2.
          replace(
              "src/engine2/schema/buildSchemaGraph.ts",
              'import { applyPriceFloor, parsePrice } from "../../utils/merchantPricing";',
              'import { resolveReliableMerchantPrice } from "../../utils/merchantPricing";'
          )
          replace(
              "src/engine2/schema/buildSchemaGraph.ts",
              '''  const fallbackPrice = applyPriceFloor(\n    parsePrice(tour.pricing?.price ?? null)\n  );\n  const schemaPrice = rewriteV3Content?.schemaPrice ?? fallbackPrice;''',
              '''  const fallbackPrice = resolveReliableMerchantPrice(tour.pricing?.price);\n  const rewriteSchemaPrice = resolveReliableMerchantPrice(\n    rewriteV3Content?.schemaPrice\n  );\n  const schemaPrice = rewriteSchemaPrice ?? fallbackPrice;'''
          )

          # Engine2 visible page: never display the old $129 floor. Preserve real
          # reserve/curated prices, otherwise use the neutral Learn More CTA.
          replace(
              "src/engine2/pages/Engine2TourPage.tsx",
              'import { PRICE_MIN_THRESHOLD_USD } from "../../constants/merchantDefaults";\n',
              ''
          )
          replace(
              "src/engine2/pages/Engine2TourPage.tsx",
              'import { applyPriceFloor, parsePrice } from "../../utils/merchantPricing";',
              'import { parsePrice, resolveReliableMerchantPrice } from "../../utils/merchantPricing";'
          )
          replace(
              "src/engine2/pages/Engine2TourPage.tsx",
              '''  const basePrice = parsePrice(tour.pricing?.price ?? null);\n  const displayPrice = applyPriceFloor(basePrice);\n  const enginePriceLabel =\n    basePrice === null || basePrice <= 0 || basePrice < PRICE_MIN_THRESHOLD_USD\n      ? undefined\n      : `From $${displayPrice.toFixed(2)} per person`;''',
              '''  const basePrice = parsePrice(tour.pricing?.price ?? null);\n  const displayPrice = resolveReliableMerchantPrice(basePrice);\n  const enginePriceLabel =\n    displayPrice === null\n      ? undefined\n      : `From $${displayPrice.toFixed(2)} per person`;'''
          )
          replace(
              "src/engine2/pages/Engine2TourPage.tsx",
              '''  const viatorPriceLabel =\n    isViatorTour && tour.pricing?.currency && displayPrice > 0\n      ? `Prices starting at ${tour.pricing.currency} ${displayPrice.toFixed(0)}`\n      : undefined;\n  const headerPriceLabel =\n    viatorPriceLabel ?? overridePriceLabel ?? enginePriceLabel;\n  const showFallbackPrice = !overridePriceLabel && !enginePriceLabel;''',
              '''  const viatorPriceLabel =\n    isViatorTour && tour.pricing?.currency && displayPrice !== null\n      ? `Prices starting at ${tour.pricing.currency} ${displayPrice.toFixed(0)}`\n      : undefined;\n  const headerPriceLabel =\n    viatorPriceLabel ?? overridePriceLabel ?? enginePriceLabel;\n  const hasReliablePrice = Boolean(headerPriceLabel);'''
          )
          replace(
              "src/engine2/pages/Engine2TourPage.tsx",
              '''          {showFallbackPrice ? (\n            <p className="mt-4 text-sm font-semibold text-white/90">\n              From $129 per person\n            </p>\n          ) : null}\n''',
              ''
          )
          replace(
              "src/engine2/pages/Engine2TourPage.tsx",
              '''                <a className="inline-flex items-center justify-center rounded-md bg-[#2f8a3d] px-4 py-2 text-sm font-semibold text-white transition hover:bg-[#287a35]">\n                  BOOK\n                </a>''',
              '''                <a className="inline-flex items-center justify-center rounded-md bg-[#2f8a3d] px-4 py-2 text-sm font-semibold text-white transition hover:bg-[#287a35]">\n                  {hasReliablePrice ? "BOOK" : "Learn More"}\n                </a>'''
          )

          # Engine2 booking page: no invented Offer and neutral CTA if the tour has
          # no reliable price yet.
          replace(
              "src/engine2/pages/Engine2TourBookingPage.tsx",
              'import { resolveInternationalGuideBreadcrumb } from "../../utils/guides/internationalGuideBreadcrumbs";',
              'import { resolveInternationalGuideBreadcrumb } from "../../utils/guides/internationalGuideBreadcrumbs";\nimport { resolveReliableMerchantPrice } from "../../utils/merchantPricing";'
          )
          replace(
              "src/engine2/pages/Engine2TourBookingPage.tsx",
              '''  const iframeUrl = isBlockedFareharborEmbed ? "" : generatedCalendarUrl;\n  const fallbackUrl = generatedCalendarUrl;''',
              '''  const iframeUrl = isBlockedFareharborEmbed ? "" : generatedCalendarUrl;\n  const fallbackUrl = generatedCalendarUrl;\n  const bookingPrice = resolveReliableMerchantPrice(tour.pricing?.price);'''
          )
          replace(
              "src/engine2/pages/Engine2TourBookingPage.tsx",
              '''        offers: {\n          "@type": "Offer",\n          url: `${seo.canonical}/book`,\n          availability: "https://schema.org/InStock",\n          price: tour.pricing?.price ?? "129.00",\n          priceCurrency: tour.pricing?.currency ?? "USD",\n        },''',
              '''        ...(bookingPrice !== null\n          ? {\n              offers: {\n                "@type": "Offer",\n                url: `${seo.canonical}/book`,\n                availability: "https://schema.org/InStock",\n                price: bookingPrice.toFixed(2),\n                priceCurrency: tour.pricing?.currency ?? "USD",\n              },\n            }\n          : {}),'''
          )
          replace(
              "src/engine2/pages/Engine2TourBookingPage.tsx",
              '''    [isRental, seo.canonical, seo.og.image, tour]\n  );''',
              '''    [bookingPrice, isRental, seo.canonical, seo.og.image, tour]\n  );'''
          )
          replace(
              "src/engine2/pages/Engine2TourBookingPage.tsx",
              '''          >\n            BOOK\n          </BookingCtaLink>''',
              '''          >\n            {bookingPrice !== null ? "BOOK" : "Learn More"}\n          </BookingCtaLink>'''
          )

          # Generic legacy detail page.
          replace(
              "src/pages/tours/TourDetail.tsx",
              'import { PRICE_MIN_THRESHOLD_USD } from "../../constants/merchantDefaults";\nimport { applyPriceFloor } from "../../utils/merchantPricing";',
              'import { resolveReliableMerchantPrice } from "../../utils/merchantPricing";'
          )
          replace(
              "src/pages/tours/TourDetail.tsx",
              '''            price: applyPriceFloor(tour.startingPrice ?? null),''',
              '''            price: resolveReliableMerchantPrice(tour.startingPrice),'''
          )
          replace(
              "src/pages/tours/TourDetail.tsx",
              '''  const startingPriceLabel = formatStartingPrice(\n    applyPriceFloor(tour.startingPrice ?? null),\n    tour.currency\n  );\n  const fareHarborHeroStartingPrice =\n    fareHarborParsed?.priceAdult ?? fareHarborParsed?.priceChild;\n  const heroStartingPriceLabel = formatStartingPrice(\n    fareHarborHeroStartingPrice ?? tour.startingPrice,\n    tour.currency\n  );\n  const isPriceFallbackApplied =\n    tour.startingPrice === undefined ||\n    tour.startingPrice === null ||\n    !Number.isFinite(tour.startingPrice) ||\n    tour.startingPrice < PRICE_MIN_THRESHOLD_USD;''',
              '''  const reliableStartingPrice = resolveReliableMerchantPrice(tour.startingPrice);\n  const startingPriceLabel =\n    reliableStartingPrice === null\n      ? null\n      : formatStartingPrice(reliableStartingPrice, tour.currency);\n  const fareHarborAdultPrice = resolveReliableMerchantPrice(\n    fareHarborParsed?.priceAdult\n  );\n  const heroStartingPriceLabel = formatStartingPrice(\n    fareHarborAdultPrice ?? reliableStartingPrice ?? undefined,\n    tour.currency\n  );'''
          )
          replace(
              "src/pages/tours/TourDetail.tsx",
              '''              <p className="mt-4 text-sm font-semibold text-[#1f2a1f]">\n                {isPriceFallbackApplied\n                  ? "From $129 per person"\n                  : `From ${startingPriceLabel} per person`}\n              </p>''',
              '''              {startingPriceLabel ? (\n                <p className="mt-4 text-sm font-semibold text-[#1f2a1f]">\n                  From {startingPriceLabel} per person\n                </p>\n              ) : null}'''
          )
          replace(
              "src/pages/tours/TourDetail.tsx",
              '''                >\n                  BOOK\n                </a>''',
              '''                >\n                  {reliableStartingPrice !== null ? "BOOK" : "Learn More"}\n                </a>''',
              count=1
          )
          replace(
              "src/pages/tours/TourDetail.tsx",
              '''              >\n                Book This Tour\n              </a>''',
              '''              >\n                {reliableStartingPrice !== null ? "Book This Tour" : "Learn More"}\n              </a>'''
          )

          # Flagstaff legacy special route.
          replace(
              "src/pages/tours/FlagstaffTourDetailRoute.tsx",
              'import { PRICE_MIN_THRESHOLD_USD } from "../../constants/merchantDefaults";\nimport { applyPriceFloor } from "../../utils/merchantPricing";',
              'import { resolveReliableMerchantPrice } from "../../utils/merchantPricing";'
          )
          replace(
              "src/pages/tours/FlagstaffTourDetailRoute.tsx",
              '            price: applyPriceFloor(tour.startingPrice ?? null),',
              '            price: resolveReliableMerchantPrice(tour.startingPrice),'
          )
          replace(
              "src/pages/tours/FlagstaffTourDetailRoute.tsx",
              '''  const startingPriceLabel = formatStartingPrice(\n    applyPriceFloor(tour.startingPrice ?? null),\n    tour.currency\n  );\n  const isPriceFallbackApplied =\n    tour.startingPrice === undefined ||\n    tour.startingPrice === null ||\n    !Number.isFinite(tour.startingPrice) ||\n    tour.startingPrice < PRICE_MIN_THRESHOLD_USD;''',
              '''  const reliableStartingPrice = resolveReliableMerchantPrice(tour.startingPrice);\n  const startingPriceLabel =\n    reliableStartingPrice === null\n      ? null\n      : formatStartingPrice(reliableStartingPrice, tour.currency);'''
          )
          replace(
              "src/pages/tours/FlagstaffTourDetailRoute.tsx",
              '''            <p className="mt-3 text-sm font-semibold text-white/90">\n              {isPriceFallbackApplied\n                ? "From $129 per person"\n                : `From ${startingPriceLabel} per person`}\n            </p>''',
              '''            {startingPriceLabel ? (\n              <p className="mt-3 text-sm font-semibold text-white/90">\n                From {startingPriceLabel} per person\n              </p>\n            ) : null}'''
          )
          replace(
              "src/pages/tours/FlagstaffTourDetailRoute.tsx",
              '''              >\n                Book Now\n              </a>''',
              '''              >\n                {reliableStartingPrice !== null ? "Book Now" : "Learn More"}\n              </a>'''
          )
          replace(
              "src/pages/tours/FlagstaffTourDetailRoute.tsx",
              '''              >\n                Book This Tour\n              </a>''',
              '''              >\n                {reliableStartingPrice !== null ? "Book This Tour" : "Learn More"}\n              </a>'''
          )

          # Unified city route (the family that includes the Google-detected Belgium
          # legacy example): trust adult/live reserve price only; never child as a
          # generic starting price, and use Learn More when no reliable price exists.
          replace(
              "src/pages/destinations/states/tours/CityTourDetailRoute.tsx",
              'import { formatStartingPrice } from "../../../../lib/pricing";',
              'import { formatStartingPrice } from "../../../../lib/pricing";\nimport { resolveReliableMerchantPrice } from "../../../../utils/merchantPricing";'
          )
          replace(
              "src/pages/destinations/states/tours/CityTourDetailRoute.tsx",
              '''                : tour.startingPrice,''',
              '''                : resolveReliableMerchantPrice(tour.startingPrice),'''
          )
          replace(
              "src/pages/destinations/states/tours/CityTourDetailRoute.tsx",
              '''  const disclosure = getAffiliateDisclosure(tour);\n  const fareHarborHeroStartingPrice =\n    fareHarborParsed?.priceAdult ?? fareHarborParsed?.priceChild;\n  const heroStartingPriceLabel = formatStartingPrice(\n    fareHarborHeroStartingPrice ?? tour.startingPrice,\n    tour.currency\n  );''',
              '''  const disclosure = getAffiliateDisclosure(tour);\n  const reliableStartingPrice = resolveReliableMerchantPrice(tour.startingPrice);\n  const fareHarborAdultPrice = resolveReliableMerchantPrice(\n    fareHarborParsed?.priceAdult\n  );\n  const heroStartingPriceValue =\n    tour.bookingProvider === "fareharbor"\n      ? (fareHarborAdultPrice ?? reliableStartingPrice ?? undefined)\n      : tour.startingPrice;\n  const heroStartingPriceLabel = formatStartingPrice(\n    heroStartingPriceValue,\n    tour.currency\n  );\n  const neutralFareHarborCta =\n    tour.bookingProvider === "fareharbor" && !heroStartingPriceLabel;'''
          )
          replace(
              "src/pages/destinations/states/tours/CityTourDetailRoute.tsx",
              '''                  {hardenedTemplate?.primaryCtaLabel ?? "BOOK"}''',
              '''                  {neutralFareHarborCta\n                    ? "Learn More"\n                    : (hardenedTemplate?.primaryCtaLabel ?? "BOOK")}'''
          )
          replace(
              "src/pages/destinations/states/tours/CityTourDetailRoute.tsx",
              '''                Book This Tour\n              </a>''',
              '''                {neutralFareHarborCta ? "Learn More" : "Book This Tour"}\n              </a>'''
          )

          # Tests: the old contract explicitly required fake $129. Replace it with
          # the truthful contract, and guard the shared V1 graph as well.
          replace(
              "src/utils/structuredData.test.ts",
              '''  it("applies a USD 129.00 offer floor when price is missing or below threshold", () => {\n    const product = buildTourProductStructuredData({\n      tour: {\n        ...baseTour,\n        startingPrice: 0,\n      },\n      detailUrl:\n        "https://www.alloutdooradventures.com/tours/california/san-diego/tour-1",\n    });\n\n    expect(product).toMatchObject({\n      offers: {\n        price: "129.00",\n        priceCurrency: "USD",\n      },\n    });\n  });''',
              '''  it("omits offers when a tour has no reliable price instead of inventing $129", () => {\n    const unpricedTour = {\n      ...baseTour,\n      startingPrice: 0,\n    };\n    const detailUrl =\n      "https://www.alloutdooradventures.com/tours/california/san-diego/tour-1";\n    const product = buildTourProductStructuredData({\n      tour: unpricedTour,\n      detailUrl,\n    });\n    const trip = buildTourTripStructuredData({\n      tour: unpricedTour,\n      detailUrl,\n    });\n\n    expect(product).not.toHaveProperty("offers");\n    expect(product).not.toHaveProperty("priceSpecification");\n    expect(trip).not.toHaveProperty("offers");\n    expect(trip).not.toHaveProperty("priceSpecification");\n    expect(JSON.stringify([product, trip])).not.toContain('"129.00"');\n  });'''
          )
          replace(
              "src/schema/buildTourSchemaGraph.test.ts",
              '''  it("keeps non-US region values unchanged", () => {''',
              '''  it("omits Product and TouristTrip offers when no truthful price is available", () => {\n    const graph = buildTourSchemaGraph({\n      ...baseArgs,\n      offers: {\n        ...baseArgs.offers,\n        price: null,\n      },\n    })["@graph"] as Array<Record<string, unknown>>;\n    const product = graph.find(node => node["@type"] === "Product") as Record<\n      string,\n      unknown\n    >;\n    const trip = graph.find(node => node["@type"] === "TouristTrip") as Record<\n      string,\n      unknown\n    >;\n\n    expect(product).not.toHaveProperty("offers");\n    expect(trip).not.toHaveProperty("offers");\n  });\n\n  it("keeps non-US region values unchanged", () => {'''
          )
          PY

      - name: Format changed source
        run: |
          npx prettier --write \
            src/utils/merchantPricing.ts \
            src/utils/structuredData.ts \
            src/schema/buildTourSchemaGraph.ts \
            src/engine2/schema/buildSchemaGraph.ts \
            src/engine2/pages/Engine2TourPage.tsx \
            src/engine2/pages/Engine2TourBookingPage.tsx \
            src/pages/tours/TourDetail.tsx \
            src/pages/tours/FlagstaffTourDetailRoute.tsx \
            src/pages/destinations/states/tours/CityTourDetailRoute.tsx \
            src/utils/structuredData.test.ts \
            src/schema/buildTourSchemaGraph.test.ts

      - name: Verify no legacy generic price remains in repaired surfaces
        run: |
          if grep -R -n 'From \$129 per person' \
            src/pages/tours/TourDetail.tsx \
            src/pages/tours/FlagstaffTourDetailRoute.tsx \
            src/engine2/pages/Engine2TourPage.tsx; then
            echo 'Found a remaining fabricated $129 visible fallback.'
            exit 1
          fi
          if grep -n '?? "129.00"' src/engine2/pages/Engine2TourBookingPage.tsx; then
            echo 'Found the Engine2 booking-schema $129 fallback.'
            exit 1
          fi

      - name: Run focused schema and FareHarbor pricing tests
        run: |
          npx vitest run \
            src/utils/structuredData.test.ts \
            src/schema/buildTourSchemaGraph.test.ts \
            src/utils/fareharbor/pricePreview.test.ts

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-truthful-fareharbor-pricing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: remove fabricated FareHarbor $129 fallback"
          git push origin HEAD:fix/fareharbor-truthful-price-no-129-fallback
