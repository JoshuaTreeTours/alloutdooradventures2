name: FareHarbor Commercial Reserve Phase 1 seed

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  seed-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: npm ci

      - name: Test Commercial Reserve resolver
        run: npx vitest run src/utils/fareharbor/pricePreview.test.ts

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Seed high-confidence Commercial Reserve
        run: npm run fetch:fareharbor-prices

      - name: Upload generated reserve
        uses: actions/upload-artifact@v4
        with:
          name: fareharbor-commercial-reserve-phase1
          path: src/data/fareharborPricing.ts
          if-no-files-found: error
