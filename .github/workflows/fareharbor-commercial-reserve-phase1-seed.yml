name: FareHarbor Commercial Reserve Phase 1 seed

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  seed-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: npm ci

      - name: Test Commercial Reserve resolver
        run: npx vitest run src/utils/fareharbor/pricePreview.test.ts

      - name: Baseline typecheck (non-blocking because main has an existing Sedona fixture syntax failure)
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Seed high-confidence Commercial Reserve
        run: npm run fetch:fareharbor-prices

      - name: Upload generated reserve
        uses: actions/upload-artifact@v4
        with:
          name: fareharbor-commercial-reserve-phase1
          path: src/data/fareharborPricing.ts
          if-no-files-found: error

      - name: Commit generated Phase 1 reserve
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/fareharborPricing.ts
          if git diff --cached --quiet; then
            echo "Reserve already current"
            exit 0
          fi
          git commit -m "Seed FareHarbor Commercial Reserve Phase 1"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
