name: One-Shot Merchant Feed A Repair

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repair-merchant-feed-a-once.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and validate merchant feed
        shell: bash
        run: |
          git show 09e9bb1ee09508481bca155980ff1063ab2a5176:data/merchantFeed.csv > /tmp/merchantFeed-clean.csv

          python3 - <<'PY'
          import csv
          import hashlib
          import re
          from pathlib import Path

          current_path = Path("data/merchantFeed.csv")
          clean_path = Path("/tmp/merchantFeed-clean.csv")

          def read_csv(path):
              with path.open(encoding="utf-8-sig", newline="") as handle:
                  return list(csv.reader(handle))

          current = read_csv(current_path)
          clean = read_csv(clean_path)
          if current[0] != clean[0]:
              raise SystemExit("merchant feed headers differ from clean baseline")

          valid_current = {
              row[0]: row[:]
              for row in current[1:]
              if len(row) == 12 and row and row[0]
          }

          # Preserve today's polished valid rows, but restore any row damaged or
          # swallowed by the malformed Hawaii CSV record from the clean blob.
          rows = [valid_current.get(row[0], row[:]) for row in clean[1:]]
          by_id = {row[0]: row for row in rows}

          for code in ("265766P28", "318692P1"):
              by_id[code][2] = by_id[code][2].replace(
                  "Hike the Grand Canyon of the Yellowstone rim",
                  "Hike the Grand Canyon South Rim",
              )

          by_id["6613P24"][2] = by_id["6613P24"][2].replace(
              "aerial views of skyline and landmark rooftops",
              "aerial views of the canyon, rim, and major landmarks",
          )

          by_id["7270P10"][2] = (
              "Paddle through Santa Barbara Harbor on a guided sunset kayak tour with close-up waterfront views and calm coastal scenery. "
              "The route stays around the harbor and nearby shoreline, with your guide handling equipment, safety, and on-water pacing. "
              "This is a relaxing way to end your day on the water while seeing Santa Barbara from a different perspective. "
              "Plan on about 2 hours for the outing, including launch preparation and guided paddling time."
          )

          by_id["331438P1"][2] = (
              "Lift off above the Santa Barbara coast on a parasailing flight with wide views of the waterfront, Stearns Wharf, beaches, and the Santa Ynez Mountains beyond the city. "
              "Your crew handles the equipment, safety briefing, launch, and return to the boat so you can focus on the flight and coastal scenery. "
              "Plan on about 1 hour for the outing, with the parasailing portion depending on marine conditions and the day's operating sequence."
          )

          by_id["447486P4"][2] = (
              "Cruise Santa Barbara Harbor on a private one-hour all-electric boat with views of the Santa Barbara Maritime Museum, Stearns Wharf, marina activity, and the waterfront. "
              "The charter is reserved for your group, creating a quiet way to see the harbor from the water without sharing the boat with other parties. "
              "Your captain handles the route and local harbor context while you relax and take in the shoreline. Plan on about 1 hour for the outing."
          )

          by_id["398496P5"][2] = (
              "See the Las Vegas Sphere from a guided driving perspective that connects the landmark with the wider Strip and resort corridor. "
              "The route includes useful exterior viewpoints and major Las Vegas Boulevard highlights, with live commentary on the city's architecture and entertainment districts. "
              "This is a practical orientation for visitors who want Sphere context without building a separate driving route. Plan on about 2 hours for the outing."
          )

          by_id["231628P7"][2] = by_id["231628P7"][2].replace(
              "A aerial sightseeing outing", "An aerial sightseeing outing"
          )

          by_id["12729PARAGLIDE"][2] = (
              by_id["12729PARAGLIDE"][2]
              .replace(
                  "strap into guests glider in tandem with guests guide",
                  "strap into your glider in tandem with your guide",
              )
              .replace("A aerial sightseeing outing", "An aerial sightseeing outing")
          )

          for code in ("70058P145", "14670CAR"):
              by_id[code][2] = (
                  by_id[code][2]
                  .replace("at guests side", "at your side")
                  .replace("guests understanding", "your understanding")
                  .replace("at guests own pace", "at your own pace")
              )

          by_id["3961P32"][2] = (
              "Enjoy a Waikiki luau with a tropical welcome drink, a generous island-style buffet, live music, hula, and fire-knife dancing. "
              "Depending on the package selected, admission can also include reserved seating for the Rock-A-Hula show. "
              "The experience takes place in Waikiki, making it an easy evening option without leaving the resort district. "
              "Prebooking secures your place for the selected dinner-and-show package."
          )

          by_id["469693P1"][2] = (
              "ʻAuana by Cirque du Soleil is a Hawaiʻi-inspired production at the Waikiki Beachcomber Hotel, blending acrobatics, comedy, live music, singing, and hula. "
              "The show brings international Cirque performers together with local Hawaiian talent and storytelling, using the company's theatrical style to explore island culture and traditions. "
              "It is a convenient Waikiki evening entertainment option for visitors who want a major live production without leaving the resort district."
          )

          if len(rows) != 1136:
              raise SystemExit(f"expected 1136 product rows, got {len(rows)}")
          if len(by_id) != 1136:
              raise SystemExit(f"expected 1136 unique product IDs, got {len(by_id)}")
          if any(len(row) != 12 for row in rows):
              raise SystemExit("one or more repaired CSV rows do not have 12 columns")

          with current_path.open("w", encoding="utf-8", newline="") as handle:
              writer = csv.writer(handle, lineterminator="\n")
              writer.writerow(clean[0])
              writer.writerows(rows)

          verify = read_csv(current_path)
          if len(verify) != 1137 or any(len(row) != 12 for row in verify):
              raise SystemExit("reloaded CSV failed row/column validation")

          text = "\n".join(" | ".join(row[:3]) for row in verify[1:])
          forbidden = {
              "Viator leakage": r"viator",
              "guests day": r"guests day",
              "guests parasailing": r"guests parasailing",
              "Santa Ynez kayak mismatch": r"Paddle through Santa Ynez Mountain",
              "truncated guarantee": r"guarant\.",
              "bad article": r"\bA aerial\b",
          }
          for label, pattern in forbidden.items():
              if re.search(pattern, text, re.I):
                  raise SystemExit(f"forbidden defect remains: {label}")

          for row in verify[1:]:
              if "/arizona/grand-canyon-national-park/" in row[3]:
                  if "Grand Canyon of the Yellowstone rim" in row[2]:
                      raise SystemExit(f"Arizona/Yellowstone contamination remains in {row[0]}")
                  if "rooftops" in row[2].lower():
                      raise SystemExit(f"Grand Canyon rooftop wording remains in {row[0]}")

          required_restored = {
              "166842P1", "375182P1", "469693P1", "3961P32", "5563928P2",
              "5501HASKY", "5069WEST60", "5069COMP60", "7029OGGHAN", "5069DOM",
              "7029OGGVOY", "326167P1", "320015P2", "64708P2", "200419P2",
              "105668P1", "104589P11", "2360M5", "62707P3", "241329P1", "2784P8",
          }
          if not required_restored.issubset(by_id):
              missing = sorted(required_restored - set(by_id))
              raise SystemExit(f"restored Hawaii rows still missing: {missing}")

          data = current_path.read_bytes()
          git_blob_sha = hashlib.sha1(
              f"blob {len(data)}\0".encode() + data
          ).hexdigest()
          expected_sha = "5b0d91b230b97b6ce7ece3c610e2c6bb7a05a5bc"
          if git_blob_sha != expected_sha:
              raise SystemExit(
                  f"repair output hash mismatch: expected {expected_sha}, got {git_blob_sha}"
              )

          print(f"PASS: 1136 unique tours, 12 columns each, repaired blob {git_blob_sha}")
          PY

      - name: Commit CSV-only final tree
        shell: bash
        run: |
          rm .github/workflows/repair-merchant-feed-a-once.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/merchantFeed.csv .github/workflows/repair-merchant-feed-a-once.yml

          if git diff --cached --quiet; then
            echo "No repair changes detected."
            exit 0
          fi

          git commit -m "Repair merchant feed and restore Hawaii inventory"
          git push
