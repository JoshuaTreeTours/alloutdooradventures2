name: FareHarbor Commercial Reserve Phase 2 seed

on:
  pull_request:
    branches:
      - feat/fareharbor-commercial-reserve-phase1

permissions:
  contents: read

jobs:
  seed-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: npm ci

      - name: Test Phase 1 and Phase 2 price resolvers
        run: npx vitest run src/utils/fareharbor/pricePreview.test.ts

      - name: Baseline typecheck (non-blocking because the parent branch inherits the existing Sedona fixture syntax failure)
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Seed Phase 2 shadow cohort
        run: npx tsx scripts/fetch-fareharbor-pricing-phase2.ts

      - name: Upload Phase 2 shadow reserve
        uses: actions/upload-artifact@v4
        with:
          name: fareharbor-commercial-reserve-phase2
          path: src/data/fareharborPricingPhase2.ts
          if-no-files-found: error
