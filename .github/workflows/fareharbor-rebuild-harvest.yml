name: FareHarbor content rebuild

on:
  push:
    branches:
      - feat/fareharbor-content-rebuild

permissions:
  contents: write

jobs:
  rebuild:
    if: ${{ !contains(github.event.head_commit.message, '[fh generated]') && !contains(github.event.head_commit.message, '[fh diagnostic]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout rebuild branch
        uses: actions/checkout@v4
        with:
          ref: feat/fareharbor-content-rebuild

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: npm ci

      - name: Harvest complete FareHarbor rebuild source
        run: npx tsx scripts/harvest-fareharbor-rebuild-source.ts

      - name: Build generated FareHarbor content registry
        run: npx tsx scripts/build-fareharbor-rebuild-registry.ts

      - name: Apply FareHarbor page and schema rules
        run: npx tsx scripts/apply-fareharbor-rebuild-code.ts

      - name: Harden optional FareHarbor CTA URL
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'src/engine2/pages/Engine2TourPage.tsx';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace(
            'href={tour.bookingUrl ?? tour.booking.bookingUrl}',
            'href={tour.bookingUrl ?? tour.booking.bookingUrl ?? "#"}',
          );
          fs.writeFileSync(path, source);
          NODE

      - name: Verify generic FareHarbor fallback rules are patched
        run: |
          grep -q 'unresolvedFareHarborPrice' src/engine2/pages/Engine2TourPage.tsx
          grep -q 'Learn More' src/engine2/pages/Engine2TourPage.tsx
          grep -q 'unresolvedFareHarborPrice' src/pages/tours/TourDetail.tsx
          grep -q 'Learn More' src/pages/tours/TourDetail.tsx
          grep -q 'PRICE_MIN_THRESHOLD_USD' src/engine2/schema/buildSchemaGraph.ts

      - name: FareHarbor-specific repository checks
        id: repository_checks
        shell: bash
        run: |
          mkdir -p reports
          set +e
          {
            echo '=== FareHarbor URL generator ==='
            npx tsx scripts/engine2/test-fh-url-generator.ts
            fh_status=$?
            echo '=== Rebuild source/registry acceptance checks ==='
            node - <<'NODE'
          const fs = require('fs');
          const harvestPath = 'reports/fareharbor-rebuild-harvest.json';
          const registryPath = 'src/data/fareharborRebuild.generated.ts';
          if (!fs.existsSync(harvestPath)) throw new Error('Missing FareHarbor harvest report');
          if (!fs.existsSync(registryPath)) throw new Error('Missing generated FareHarbor rebuild registry');
          const harvest = JSON.parse(fs.readFileSync(harvestPath, 'utf8'));
          const summary = harvest.summary || {};
          const universe = Number(summary.uniqueFareHarborItems ?? summary.uniqueItems ?? summary.discoveredItems ?? 0);
          const rewriteReady = Number(summary.rewriteReady ?? summary.rewriteReadyItems ?? summary.descriptionRewriteReady ?? 0);
          if (universe < 7000) throw new Error(`Implausibly small FareHarbor universe: ${universe}`);
          if (rewriteReady < 6000) throw new Error(`Implausibly small rewrite-ready population: ${rewriteReady}`);
          const generated = fs.readFileSync(registryPath, 'utf8');
          const routeCount = (generated.match(/^  "\/destinations\//gm) || []).length;
          if (routeCount < 6000) throw new Error(`Implausibly small generated route count: ${routeCount}`);
          if (!generated.includes('145208')) throw new Error('Country Boy Gold Mine Tour 145208 missing from generated registry');
          console.log(JSON.stringify({ universe, rewriteReady, generatedRoutes: routeCount, countryBoy145208: true }));
          NODE
            acceptance_status=$?
          } 2>&1 | tee reports/fareharbor-rebuild-check.log
          status=0
          if [ "$fh_status" -ne 0 ] || [ "$acceptance_status" -ne 0 ]; then status=1; fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit check diagnostics on failure
        if: ${{ steps.repository_checks.outputs.status != '0' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/fareharbor-rebuild-check.log
          git commit -m "[fh diagnostic] Capture rebuild check failure"
          git push origin HEAD:feat/fareharbor-content-rebuild
          exit 1

      - name: Production build and structured-data audits
        id: production_build
        shell: bash
        env:
          MERCHANT_FEED_RUNTIME_BASE_URL: https://www.alloutdooradventures.com
        run: |
          mkdir -p reports
          set +e
          npm run build 2>&1 | tee reports/fareharbor-rebuild-build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit build diagnostics on failure
        if: ${{ steps.production_build.outputs.status != '0' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/fareharbor-rebuild-build.log
          git commit -m "[fh diagnostic] Capture rebuild production build failure"
          git push origin HEAD:feat/fareharbor-content-rebuild
          exit 1

      - name: Write rebuild summary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const harvest = JSON.parse(fs.readFileSync('reports/fareharbor-rebuild-harvest.json','utf8'));
          const generated = fs.readFileSync('src/data/fareharborRebuild.generated.ts','utf8');
          const routeCount = (generated.match(/^  "\/destinations\//gm) || []).length;
          const summary = {
            ...harvest.summary,
            generatedRoutes: routeCount,
            fallbackPricePolicy: 'Unverified FareHarbor prices omitted from visible page and Product Offer price',
            unresolvedFareHarborCta: 'Learn More'
          };
          fs.writeFileSync('reports/fareharbor-content-rebuild-summary.json', JSON.stringify(summary, null, 2));
          console.log('[fh-content-rebuild] SUMMARY', JSON.stringify(summary));
          NODE

      - name: Upload rebuild evidence
        uses: actions/upload-artifact@v4
        with:
          name: fareharbor-content-rebuild-evidence
          path: |
            reports/fareharbor-rebuild-harvest.json
            reports/fareharbor-rebuild-harvest.md
            reports/fareharbor-content-rebuild-summary.json
          if-no-files-found: error

      - name: Commit generated rebuild after green checks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/fareharborRebuild.generated.ts \
                  src/engine2/pages/Engine2TourPage.tsx \
                  src/engine2/schema/buildSchemaGraph.ts \
                  src/pages/tours/TourDetail.tsx \
                  src/pages/tours/FlagstaffTourDetailRoute.tsx
          if git diff --cached --quiet; then
            echo "No generated rebuild changes to commit."
          else
            git commit -m "[fh generated] Rebuild FareHarbor product content"
            git push origin HEAD:feat/fareharbor-content-rebuild
          fi
