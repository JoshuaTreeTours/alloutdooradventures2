name: Merchant Feed A+ Finalize

on:
  push:
    paths:
      - '.github/workflows/merchant-feed-a-plus.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and validate A+ repairs
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, base64, gzip, re, hashlib, subprocess
          from pathlib import Path

          path = Path('data/merchantFeed.csv')

          # The full patch manifest is retained in this commit's parent workflow.
          prior = subprocess.check_output(
              ['git','show','HEAD^:.github/workflows/merchant-feed-a-plus.yml'],
              text=True
          )
          m = re.search(r"base64\.b64decode\('([^']+)'\)", prior)
          assert m, 'A+ patch manifest not found in parent workflow'
          updates = json.loads(gzip.decompress(base64.b64decode(m.group(1))).decode('utf-8'))

          fields = ['id','title','description','link','image_link','availability','price','condition','brand','average_rating','rating_count','review_count']
          with path.open('r', newline='', encoding='utf-8-sig') as f:
              reader = csv.DictReader(f)
              assert reader.fieldnames == fields
              rows = list(reader)

          assert len(rows) == 1136 and len({r['id'] for r in rows}) == 1136
          byid = {r['id']: r for r in rows}
          assert not (set(updates) - set(byid))

          for pid, patch in updates.items():
              for key, value in patch.items():
                  byid[pid][key] = value

          for r in rows:
              assert all(r[k].strip() for k in fields[:9])
              assert r['availability'] == 'in stock'
              assert r['condition'] == 'new'
              assert r['brand'] == 'Outdoor Adventures'
              assert re.fullmatch(r'\d+(?:\.\d{1,2})? USD', r['price'])
              assert r['link'].startswith('https://www.alloutdooradventures.com/')
              assert r['image_link'].startswith(('http://','https://'))
              assert 500 <= len(r['description']) <= 1000
              assert len(r['title']) <= 150
              assert r['description'][-1] in '.!?'
              assert 'viator' not in (r['title'] + ' ' + r['description']).lower()

          for key in ('title','description','link'):
              vals = [r[key] for r in rows]
              assert len(vals) == len(set(vals))

          corpus = '\n'.join(r['description'] for r in rows).lower()
          for phrase in [
              'guests day','guests parasailing','paddle through santa ynez mountain',
              'guarant.','a aerial','a included lunch','city or yucatan',
              'confirmation for this tour will be received',
              'market stalls, specialty foods, and public-market history shape the walking format across moab'
          ]:
              assert phrase not in corpus

          assert [r['id'] for r in rows if 'aerial course' in r['description'].lower()] == ['421920P3']

          # Yellowstone legitimately has many Grand Canyon of the Yellowstone references.
          # The defect was that this phrase had leaked into two Arizona Grand Canyon products.
          for pid in ('265766P28','318692P1'):
              text = (byid[pid]['title'] + ' ' + byid[pid]['description']).lower()
              assert 'grand canyon of the yellowstone' not in text

          with path.open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n', quoting=csv.QUOTE_MINIMAL)
              w.writeheader()
              w.writerows(rows)

          data = path.read_bytes()
          raw = hashlib.sha1(data).hexdigest()
          blob = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
          assert raw == '144b8109cadbe8d7da752bd412ea4b28e3b3846e', raw
          assert blob == 'f3ac1308ee9e70585e972ceec574e2b3e141419b', blob
          print('PASS:', len(rows), 'unique tours; final blob', blob)
          PY

      - name: Commit final CSV and self-remove
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/merchant-feed-a-plus.yml
          git add data/merchantFeed.csv .github/workflows/merchant-feed-a-plus.yml
          git commit -m 'Polish merchant feed to A+ quality'
          git push origin HEAD:main
