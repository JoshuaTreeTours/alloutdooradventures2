name: Merchant Feed A+ Finalize

on:
  push:
    paths:
      - '.github/workflows/merchant-feed-a-plus.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate A+ repairs
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, base64, gzip, re, hashlib
          from pathlib import Path
          path=Path('data/merchantFeed.csv')
          updates=json.loads(gzip.decompress(base64.b64decode('')).decode('utf-8'))
          fields=['id','title','description','link','image_link','availability','price','condition','brand','average_rating','rating_count','review_count']
          with path.open('r',newline='',encoding='utf-8-sig') as f:
              reader=csv.DictReader(f); assert reader.fieldnames==fields; rows=list(reader)
          assert len(rows)==1136 and len({r['id'] for r in rows})==1136
          byid={r['id']:r for r in rows}; assert not (set(updates)-set(byid))
          for pid,patch in updates.items():
              for k,v in patch.items(): byid[pid][k]=v
          for r in rows:
              assert all(r[k].strip() for k in fields[:9])
              assert r['availability']=='in stock' and r['condition']=='new' and r['brand']=='Outdoor Adventures'
              assert re.fullmatch(r'\d+(?:\.\d{1,2})? USD',r['price'])
              assert r['link'].startswith('https://www.alloutdooradventures.com/') and r['image_link'].startswith(('http://','https://'))
              assert 500<=len(r['description'])<=1000 and len(r['title'])<=150 and r['description'][-1] in '.!?'
              assert 'viator' not in (r['title']+' '+r['description']).lower()
          for k in ('title','description','link'):
              vals=[r[k] for r in rows]; assert len(vals)==len(set(vals))
          corpus='\n'.join(r['description'] for r in rows).lower()
          for p in ['guests day','guests parasailing','paddle through santa ynez mountain','guarant.','a aerial','a included lunch','city or yucatan','confirmation for this tour will be received','market stalls, specialty foods, and public-market history shape the walking format across moab']:
              assert p not in corpus
          assert [r['id'] for r in rows if 'aerial course' in r['description'].lower()]==['421920P3']
          assert [r['id'] for r in rows if 'grand canyon of the yellowstone' in (r['title']+' '+r['description']).lower()]==['23667P1']
          with path.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n',quoting=csv.QUOTE_MINIMAL); w.writeheader(); w.writerows(rows)
          data=path.read_bytes(); raw=hashlib.sha1(data).hexdigest(); blob=hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
          assert raw=='144b8109cadbe8d7da752bd412ea4b28e3b3846e',raw
          assert blob=='f3ac1308ee9e70585e972ceec574e2b3e141419b',blob
          print('PASS:',len(rows),'unique tours; final blob',blob)
          PY
      - name: Commit final CSV and self-remove
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/merchant-feed-a-plus.yml
          git add data/merchantFeed.csv .github/workflows/merchant-feed-a-plus.yml
          git commit -m 'Polish merchant feed to A+ quality'
          git push origin HEAD:main
